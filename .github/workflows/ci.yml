name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  proto:
    name: Proto lint and generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint and regenerate
        run: bash scripts/gen-proto.sh
      - name: Generated Go code is up to date
        run: git diff --exit-code -- api/gen

  go:
    name: Go API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  cpp:
    name: C++ engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and run unit tests
        run: docker build --target test -f docker/cpp-engine.Dockerfile .

  integration:
    name: Compose integration
    runs-on: ubuntu-latest
    needs: [proto, go, cpp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Wait for the API
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz && exit 0
            sleep 1
          done
          docker compose logs
          exit 1
      - name: Integration tests
        working-directory: api
        run: API_URL=http://localhost:8080 go test -tags integration -count=1 -v ./test/integration
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v
